<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-title' content='Lakes'><title>Lake Picker</title><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><style>:root{--bg:#f4f6f5;--card:#fff;--tx:#1a2422;--mu:#5b6b67;--ac:#0b6e63;--bd:#d9e0de}@media(prefers-color-scheme:dark){:root{--bg:#10171a;--card:#182125;--tx:#e6eeec;--mu:#9bb0aa;--ac:#4fc3b3;--bd:#2a373b}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:720px;margin:0 auto;padding:14px}h1{font-size:22px;margin:4px 0 10px}h2{font-size:18px;margin:0 0 6px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}.mu{color:var(--mu);font-size:14px}button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}a{color:var(--ac)}textarea,input{width:100%}#map{height:65vh;min-height:320px;border-radius:12px;border:1px solid var(--bd)}.leaflet-popup-content{color:#1a2422;font:14px/1.4 system-ui,sans-serif}.leaflet-popup-content button{color:#fff;background:#0b6e63;border:0;margin-top:6px}</style></head><body><main id='app'><p>Loading…</p></main><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'></script><script>const U='https://qkraxgbvnqgncxnzhmnj.supabase.co',K='sb_publishable_h9eBM7tZIDbQCy5JxBdJmw_ZqqaFJ9a',sb=supabase.createClient(U,K);const S={lakes:[],sv:[],user:null,favs:new Set(),notes:[],v:'map',lake:null,cmp:[],sp:'Walleye',msg:'',err:''};let MAP=null;const esc=t=>String(t==null?'':t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll(`'`,'&#39;');const lk=id=>S.lakes.find(l=>l.id===id);const rate=r=>r.catch_rate==null?'n/a':r.catch_rate+' '+(r.catch_rate_unit||'');const rng=r=>r.normal_range_low!=null&&r.normal_range_high!=null?r.normal_range_low+'–'+r.normal_range_high:'—';const len=r=>(r.avg_length_in!=null?'avg '+r.avg_length_in+' in':'')+(r.largest_in!=null?', max '+r.largest_in+' in':'');const pri=s=>s==='Walleye'?0:s==='Black crappie'?1:2;const best=(id,sp)=>S.sv.find(r=>r.lake_id===id&&r.species===sp);const brief=(id,sp)=>{const r=best(id,sp);return r?rate(r)+' ('+r.survey_year+')':'no survey data'};async function load(){const a=await sb.from('lakes').select('*').order('name');const b=await sb.from('fish_surveys').select('*').order('survey_year',{ascending:false});S.lakes=a.data||[];S.sv=b.data||[];if(a.error||b.error)S.err='Could not load lake data.';await who();render()}async function who(){const r=await sb.auth.getSession();S.user=r.data.session?r.data.session.user:null;S.favs=new Set();S.notes=[];if(S.user){const f=await sb.from('favorites').select('lake_id');S.favs=new Set((f.data||[]).map(x=>x.lake_id));const n=await sb.from('lake_notes').select('*').order('created_at',{ascending:false});S.notes=n.data||[]}}sb.auth.onAuthStateChange(()=>{setTimeout(async()=>{await who();render()},0)});function go(v,id){S.v=v;if(id!=null)S.lake=id;S.msg='';window.scrollTo(0,0);render()}async function fav(id){if(!S.user)return go('auth');if(S.favs.has(id))await sb.from('favorites').delete().eq('lake_id',id);else await sb.from('favorites').insert({lake_id:id});await who();render()}async function addNote(){const t=document.getElementById('nt').value.trim();if(!t)return;const r=await sb.from('lake_notes').insert({lake_id:S.lake,note:t});if(r.error)S.err='Could not save note.';await who();render()}async function delNote(id){await sb.from('lake_notes').delete().eq('id',id);await who();render()}async function auth(up){const e=document.getElementById('em').value.trim(),p=document.getElementById('pw').value;const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)S.msg=r.error.message;else if(up&&!r.data.session)S.msg='Check your email to confirm your account, then sign in.';else{await who();S.v='list';S.msg=''}render()}async function out(){await sb.auth.signOut();go('list')}function tgl(id){const i=S.cmp.indexOf(id);S.msg='';if(i>=0)S.cmp.splice(i,1);else if(S.cmp.length<3)S.cmp.push(id);else S.msg='Compare up to 3 lakes at a time.';render()}function head(){return `<h1>Lake Picker</h1><nav><button data-a='map'>Map</button><button data-a='list'>Lakes</button><button data-a='cmp'>Compare (${S.cmp.length})</button>${S.user?`<button data-a='out'>Sign out</button>`:`<button data-a='auth'>Sign in</button>`}</nav>${S.msg?`<p class='card'>${esc(S.msg)}</p>`:''}${S.err?`<p class='card'>${esc(S.err)}</p>`:''}`}function mapView(){return `<div id='map'></div><p class='mu'>Tap a pin for a quick summary, then Details for the full DNR survey data. Use the layers button to switch to satellite.</p>`}function initMap(){const el=document.getElementById('map');if(!el||typeof L==='undefined')return;if(MAP){try{MAP.remove()}catch(e){}MAP=null}const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'});MAP=L.map(el,{layers:[osm]}).setView([45.15,-92.7],9);L.control.layers({'Map':osm,'Satellite':sat}).addTo(MAP);const pts=[];S.lakes.forEach(l=>{if(l.latitude==null||l.longitude==null)return;const p=[Number(l.latitude),Number(l.longitude)];pts.push(p);L.marker(p).addTo(MAP).bindPopup(`<b>${esc(l.name)}</b><br>${esc(l.state)} · ${l.acres?Math.round(l.acres)+' acres':'size n/a'}${l.max_depth_ft?' · '+l.max_depth_ft+' ft deep':''}<br>Walleye: ${esc(brief(l.id,'Walleye'))}<br>Crappie: ${esc(brief(l.id,'Black crappie'))}<br><button data-a='lake' data-i='${l.id}'>Details</button>`)});if(pts.length>1)MAP.fitBounds(pts,{padding:[40,40]});setTimeout(()=>MAP&&MAP.invalidateSize(),100)}function listView(){return S.lakes.map(l=>{const n=S.sv.filter(r=>r.lake_id===l.id).length;return `<div class='card'><h2>${esc(l.name)}</h2><div class='mu'>${esc(l.state)} · ${esc(l.county||'')} · ${l.acres?Math.round(l.acres)+' acres':'size n/a'}${l.max_depth_ft?' · '+l.max_depth_ft+' ft deep':''}</div><div class='mu'>${n?n+' survey records':'No survey data yet'}</div><div class='row' style='margin-top:8px'><button class='p' data-a='lake' data-i='${l.id}'>Details</button><button data-a='tgl' data-i='${l.id}'>${S.cmp.includes(l.id)?'✓ Comparing':'Compare'}</button><button data-a='fav' data-i='${l.id}'>${S.favs.has(l.id)?'★ Saved':'☆ Save'}</button></div></div>`}).join('')}function lakeView(){const l=lk(S.lake);if(!l)return '';const rows=S.sv.filter(r=>r.lake_id===l.id);const nts=S.notes.filter(n=>n.lake_id===l.id);return `<button data-a='list'>← Back</button><div class='card'><h2>${esc(l.name)}</h2><div class='mu'>${esc(l.state)} · ${esc(l.county||'')} · ${l.acres?Math.round(l.acres)+' acres':''}${l.max_depth_ft?' · '+l.max_depth_ft+' ft deep':''}</div><p>${esc(l.lake_notes||'')}</p>${l.dnr_url?`<p><a href='${esc(l.dnr_url)}' target='_blank' rel='noopener'>DNR lake page and depth map</a></p>`:''}<p class='mu'>Data source: ${esc(l.data_source||'')}. Depth maps are for planning, not navigation.</p></div><div class='card'><h2>DNR fish surveys</h2>${rows.length?`<div class='w'><table><tr><th>Fish</th><th>Year</th><th>Gear</th><th>Catch rate</th><th>Normal</th><th>Size</th></tr>${rows.map(r=>`<tr><td>${esc(r.species)}</td><td>${esc(r.survey_year)}</td><td>${esc(r.gear)}</td><td>${esc(rate(r))}</td><td>${rng(r)}</td><td>${esc(len(r))}</td></tr><tr><td colspan='6' class='mu'>${esc(r.notes||'')}</td></tr>`).join('')}</table></div>`:`<p class='mu'>No survey records yet.</p>`}</div><div class='card'><h2>Your notes</h2>${S.user?`<textarea id='nt' rows='3' placeholder='Spots, baits, what worked…'></textarea><p><button class='p' data-a='note'>Add note</button></p>${nts.map(n=>`<p>${esc(n.note)} <button data-a='del' data-i='${n.id}'>Delete</button></p>`).join('')}`:`<p class='mu'>Sign in to save notes and favorites.</p>`}</div>`}function cmpView(){const sps=[...new Set(S.sv.map(r=>r.species))].sort((a,b)=>pri(a)-pri(b)||a.localeCompare(b));if(!sps.includes(S.sp))S.sp=sps[0]||'';const rows=S.cmp.map(id=>({l:lk(id),r:S.sv.find(x=>x.lake_id===id&&x.species===S.sp)}));const used=new Set(rows.filter(x=>x.r).map(x=>x.r.catch_rate_unit+x.r.gear));return `<div class='card'><h2>Compare lakes</h2><p class='mu'>Choose up to 3 lakes with the Compare button on the Lakes tab, then pick a fish.</p><select id='sp'>${sps.map(s=>`<option${s===S.sp?' selected':''}>${esc(s)}</option>`).join('')}</select></div>`+(rows.length?rows.filter(x=>x.l).map(x=>`<div class='card'><h2>${esc(x.l.name)}</h2>${x.r?`<p><b>${esc(rate(x.r))}</b> · ${esc(x.r.survey_year)} · ${esc(x.r.gear)}</p><p class='mu'>Normal range: ${rng(x.r)} ${esc(len(x.r))}</p><p class='mu'>${esc(x.r.notes||'')}</p>`:`<p class='mu'>No ${esc(S.sp)} survey data for this lake.</p>`}</div>`).join('')+(used.size>1?`<p class='card mu'>These lakes were sampled with different gear or units, so do not compare the raw numbers directly. Use the normal range and notes.</p>`:''):`<p class='mu'>No lakes selected yet.</p>`)}function authView(){return `<div class='card'><h2>Sign in</h2><p><input id='em' type='email' placeholder='Email' autocomplete='email'></p><p><input id='pw' type='password' placeholder='Password (6+ characters)' autocomplete='current-password'></p><div class='row'><button class='p' data-a='in'>Sign in</button><button data-a='up'>Create account</button></div></div>`}function render(){document.getElementById('app').innerHTML=head()+(S.v==='map'?mapView():S.v==='lake'?lakeView():S.v==='cmp'?cmpView():S.v==='auth'?authView():listView());if(S.v==='map')initMap()}document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i==null?null:Number(b.dataset.i);if(a==='list')go('list');else if(a==='map')go('map');else if(a==='lake')go('lake',i);else if(a==='cmp')go('cmp');else if(a==='auth')go('auth');else if(a==='fav')fav(i);else if(a==='tgl')tgl(i);else if(a==='note')addNote();else if(a==='del')delNote(i);else if(a==='in')auth(false);else if(a==='up')auth(true);else if(a==='out')out()});document.addEventListener('change',e=>{if(e.target.id==='sp'){S.sp=e.target.value;render()}});load();</script></body></html>
